<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>12個月節慶英打闖關年曆網 (每關精準20字挑戰)</title>
  <style>
    body {
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
      text-align: center;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      transition: background 0.5s ease;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* 清除存檔按鈕 */
    .reset-save-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(239, 68, 68, 0.85);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      z-index: 100;
    }
    .reset-save-btn:hover { background: #dc2626; }

    /* 1. 歡迎/入口封面頁 */
    #welcome-screen {
      max-width: 650px;
      margin: 60px auto 0 auto;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 50px 30px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      border: 2px solid rgba(255, 255, 255, 0.8);
      animation: fadeIn 0.6s ease;
    }

    .welcome-icon { font-size: 4.5rem; margin-bottom: 10px; }
    .welcome-title { font-size: 2.2rem; color: #1e293b; margin: 10px 0; }
    .welcome-subtitle { font-size: 1.1rem; color: #64748b; margin-bottom: 35px; line-height: 1.6; }
    
    .enter-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 1.3rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      transition: all 0.3s ease;
    }
    .enter-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
    }

    /* 2. 年曆樣式首頁 */
    #calendar-container {
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      border: 2px solid #ffffff;
    }

    .calendar-header {
      margin-bottom: 25px;
      border-bottom: 2px dashed #cbd5e1;
      padding-bottom: 15px;
    }
    .calendar-header h2 { font-size: 1.8rem; color: #0f172a; margin: 0 0 8px 0; }
    .calendar-header p { color: #64748b; margin: 0; font-size: 0.95rem; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .month-badge-card {
      background: #ffffff;
      padding: 15px 10px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
    }

    .month-badge-card:hover {
      transform: translateY(-5px);
      border-color: #3b82f6;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.15);
      background: #f8fafc;
    }

    .month-num {
      position: absolute;
      top: 10px;
      left: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #94a3b8;
    }

    .month-icon { font-size: 2.2rem; margin: 8px 0 4px 0; }
    .month-title { font-size: 1.05rem; font-weight: bold; color: #1e293b; margin: 0; }
    .month-desc { font-size: 0.8rem; color: #64748b; margin-top: 4px; }

    /* 3. 關卡選擇畫面 */
    #stage-select-screen {
      max-width: 750px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
      border: 2px solid rgba(255,255,255,0.6);
    }

    .stage-header-box { margin-top: 10px; margin-bottom: 20px; }
    .stage-header-box h2 { font-size: 1.8rem; color: #0f172a; margin: 10px 0 5px 0; }
    .stage-header-box p { color: #475569; font-size: 1rem; font-weight: 500; margin: 0; }

    .stage-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 25px;
    }

    .stage-card {
      background: #ffffff;
      padding: 25px 15px;
      border-radius: 18px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: all 0.3s ease;
      border-top: 6px solid #10b981;
    }

    .stage-card.locked {
      background: #f1f5f9;
      border-top: 6px solid #94a3b8;
      cursor: not-allowed;
      opacity: 0.65;
    }

    .stage-card:not(.locked):hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
      border-top-color: #f59e0b;
    }

    .stage-card h3 { color: #047857; margin: 0 0 8px 0; font-size: 1.25rem; }
    .stage-card.locked h3 { color: #64748b; }
    .stage-card p { color: #64748b; margin: 0; font-size: 0.9rem; font-weight: bold; }

    /* 4. 遊戲畫面 */
    #game-screen {
      max-width: 650px;
      margin: 20px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .back-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #334155;
      float: left;
      transition: all 0.2s;
    }
    .back-btn:hover { background: #f1f5f9; transform: scale(1.03); }

    .festival-header { clear: both; margin-top: 15px; }
    .festival-header h2 { color: #0f172a; margin-bottom: 5px; }

    .stage-indicator {
      font-size: 1.1rem;
      font-weight: bold;
      color: #2563eb;
      background: #eff6ff;
      padding: 6px 15px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .festival-theme-box {
      background: #f1f5f9;
      padding: 8px 15px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 5px 0 15px 0;
      font-weight: bold;
      color: #334155;
    }

    .timer-container { margin: 15px auto; width: 85%; }
    .timer-bar-bg {
      width: 100%; height: 12px;
      background: #e2e8f0; border-radius: 6px; overflow: hidden; margin-top: 5px;
    }
    .timer-bar-fill {
      width: 100%; height: 100%;
      background: #f59e0b; transition: width 1s linear;
    }

    .word-card {
      font-size: 2.8rem;
      margin: 15px 0 5px 0;
      padding: 15px;
      background: #f8fafc;
      border-radius: 16px;
      border: 2px dashed #cbd5e1;
      display: inline-block;
    }

    .highlight {
      font-size: 3.2rem;
      font-weight: bold;
      color: #dc2626;
      background: #fee2e2;
      border: 3px solid #ef4444;
      border-radius: 10px;
      padding: 2px 14px;
      margin-right: 6px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }

    .word-rest { color: #64748b; letter-spacing: 2px; }

    /* 剩餘5秒以內的動態指法提示區 */
    .finger-hint-box {
      min-height: 30px;
      margin-bottom: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #d97706;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 6px 12px;
      display: inline-block;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .finger-hint-box.show { opacity: 1; }

    .virtual-keyboard {
      background: #e2e8f0;
      padding: 12px;
      border-radius: 12px;
      max-width: 480px;
      margin: 10px auto;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }

    .keyboard-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }

    .virtual-keyboard .key {
      width: 36px; height: 40px;
      background: #ffffff; border-radius: 6px;
      display: flex; justify-content: center; align-items: center;
      font-weight: bold; font-size: 0.9rem; color: #475569;
      box-shadow: 0 3px 0 #cbd5e1; transition: all 0.1s ease;
    }

    .home-row .key.home-highlight { background: #fef08a; color: #854d0e; }
    .top-row .key.top-highlight { background: #bae6fd; color: #0369a1; }
    .bottom-row .key.bottom-highlight { background: #bbf7d0; color: #15803d; }

    .virtual-keyboard .key.fj-key { border-bottom: 3px solid #2563eb; }

    .virtual-keyboard .key.active-target {
      background: #ef4444 !important; color: white !important;
      transform: scale(1.15); box-shadow: 0 0 15px rgba(239, 68, 68, 0.7); z-index: 10;
    }

    .progress-info { font-size: 1.1rem; color: #334155; font-weight: bold; margin-top: 10px; }

    .countdown-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      border-radius: 20px; z-index: 50;
    }

    .countdown-number {
      font-size: 5rem; font-weight: bold; color: #2563eb; animation: pulse 1s infinite;
    }

    .start-btn {
      background: #10b981; color: white; border: none;
      padding: 15px 30px; font-size: 1.3rem; border-radius: 12px;
      cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      transition: background 0.2s;
    }
    .start-btn:hover { background: #059669; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); display: none;
      justify-content: center; align-items: center; z-index: 1000;
    }

    .modal-content {
      background: white; padding: 30px; border-radius: 20px;
      text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.25); max-width: 480px; width: 90%;
      max-height: 85vh; overflow-y: auto;
    }

    .modal-content h2 { color: #16a34a; margin-top: 0; }
    
    .analysis-box {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
      padding: 12px; margin: 15px 0; text-align: left; font-size: 0.9rem; color: #334155;
    }
    .analysis-box h4 { margin: 0 0 8px 0; color: #1e293b; text-align: center; }

    .modal-content button {
      background: #3b82f6; color: white; border: none; padding: 12px 24px;
      border-radius: 8px; font-size: 1.1rem; cursor: pointer; margin: 8px; font-weight: bold;
    }
    .modal-content button:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <button class="reset-save-btn" onclick="resetSaveData()">🗑️ 重置所有存檔</button>

  <!-- 1. 歡迎/入口封面頁 -->
  <div id="welcome-screen" class="screen active">
    <div class="welcome-icon">🎡</div>
    <h1 class="welcome-title">12 個月節慶英打闖關網</h1>
    <p class="welcome-subtitle">
      跟著節慶主題練習英打指法！<br>
      挑戰中排、上排與下排鍵盤練習，解鎖 12 個月節慶專屬年曆！
    </p>
    <button class="enter-btn" onclick="goToCalendarScreen()">🚀 開始挑戰遊戲</button>
  </div>

  <!-- 2. 節慶年曆選單頁 -->
  <div id="calendar-screen" class="screen">
    <div id="calendar-container">
      <div class="calendar-header">
        <h2>📅 12 個月節慶主題年曆</h2>
        <p>請點擊月份展開關卡特訓 (過關自動解鎖進度)</p>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>
  </div>

  <!-- 3. 關卡選擇畫面 (Stage 1 ~ 6) -->
  <div id="stage-select-screen" class="screen">
    <button class="back-btn" onclick="backToCalendar()">⬅ 返回節慶年曆</button>
    <div class="stage-header-box">
      <div id="stage-header-icon" style="font-size: 3.5rem;">🎆</div>
      <h2 id="stage-menu-title">一月：跨年元旦 - 選擇關卡</h2>
      <p id="stage-menu-desc">迎接新年的第一道署光，踏上指法特訓之旅！</p>
    </div>
    <div class="stage-grid" id="stage-grid"></div>
  </div>

  <!-- 4. 遊戲實際練習畫面 -->
  <div id="game-screen" class="screen">
    
    <div id="countdown-overlay" class="countdown-overlay">
      <div id="ready-content">
        <h2 id="ready-title" style="color: #1e293b; margin-bottom: 20px;">準備好挑戰了嗎？</h2>
        <button class="start-btn" onclick="startCountdown()">點擊開始挑戰</button>
      </div>
      <div id="countdown-number" class="countdown-number" style="display:none;">3</div>
    </div>

    <button class="back-btn" onclick="backToStageSelect()">⬅ 返回關卡選單</button>
    
    <div class="festival-header">
      <div id="stage-badge" class="stage-indicator">Stage 1</div>
      <h2 id="festival-title">二月：農曆新年</h2>
      <div id="festival-theme-box" class="festival-theme-box">
        <span id="festival-icon" style="font-size: 1.8rem;">🧨</span>
        <span id="theme-desc">點燃鞭炮，迎春接福！</span>
      </div>
    </div>

    <div class="timer-container">
      <div style="font-size: 0.9rem; color: #64748b;">思考倒數：<span id="time-left">10</span> 秒</div>
      <div class="timer-bar-bg">
        <div id="timer-bar" class="timer-bar-fill"></div>
      </div>
    </div>

    <div class="word-card">
      <span id="highlight-letter" class="highlight">[A]</span>
      <span id="remaining-word" class="word-rest">pple</span>
    </div>

    <!-- 剩餘 5 秒內才會顯示的指法位置提示區 -->
    <div>
      <div id="finger-hint" class="finger-hint-box">💡 提示：載入中...</div>
    </div>

    <!-- 虛擬鍵盤 -->
    <div class="virtual-keyboard">
      <div class="keyboard-row top-row">
        <span class="key" data-key="Q">Q</span><span class="key" data-key="W">W</span><span class="key" data-key="E">E</span><span class="key" data-key="R">R</span><span class="key" data-key="T">T</span><span class="key" data-key="Y">Y</span><span class="key" data-key="U">U</span><span class="key" data-key="I">I</span><span class="key" data-key="O">O</span><span class="key" data-key="P">P</span>
      </div>
      <div class="keyboard-row home-row">
        <span class="key" data-key="A">A</span><span class="key" data-key="S">S</span><span class="key" data-key="D">D</span><span class="key" data-key="F" id="key-F">F</span><span class="key" data-key="G">G</span><span class="key" data-key="H">H</span><span class="key" data-key="J" id="key-J">J</span><span class="key" data-key="K">K</span><span class="key" data-key="L">L</span>
      </div>
      <div class="keyboard-row bottom-row">
        <span class="key" data-key="Z">Z</span><span class="key" data-key="X">X</span><span class="key" data-key="C">C</span><span class="key" data-key="V">V</span><span class="key" data-key="B">B</span><span class="key" data-key="N">N</span><span class="key" data-key="M">M</span>
      </div>
    </div>

    <div id="progress-info" class="progress-info">本關目標進度：已打對 0 / 20 次</div>
  </div>

        wordsStage1: { 'A': 'Angel', 'S': 'Santa', 'D': 'Decoration', 'F': 'Fir-tree', 'G': 'Gift', 'H': 'Holiday', 'J': 'Jingle', 'K': 'Kris-kringle', 'L': 'Light' },
        wordsStage2: { 'Q': 'Quiet', 'W': 'Wrap', 'E': 'Elf', 'R': 'Reindeer', 'T': 'Tree', 'Y': 'Yule', 'U': 'Unwrap', 'I': 'Icicle', 'O': 'Ornament', 'P': 'Present' },
        wordsStage3: { 'Z': 'Zeal', 'X': 'Xmas', 'C': 'Carols', 'V': 'Visit', 'B': 'Bell', 'N': 'Noel', 'M': 'Merry' }

    };

    const FINGER_POSITIONS = {
      'Q': '上排左手小指', 'W': '上排左手無名指', 'E': '上排左手中指', 'R': '上排左手食指', 'T': '上排左手食指',
      'Y': '上排右手食指', 'U': '上排右手食指', 'I': '上排右手中指', 'O': '上排右手無名指', 'P': '上排右手小指',
      'A': '中排左手小指', 'S': '中排左手無名指', 'D': '中排左手中指', 'F': '中排左手食指 (定位鍵)', 'G': '中排左手食指',
      'H': '中排右手食指', 'J': '中排右手食指 (定位鍵)', 'K': '中排右手中指', 'L': '中排右手無名指',
      'Z': '下排左手小指', 'X': '下排左手無名指', 'C': '下排左手中指', 'V': '下排左手食指', 'B': '下排左手食指',
      'N': '下排右手食指', 'M': '下排右手食指'
    };

    let currentMonth = 1;
    let currentStage = 1;
    let currentKey = 'A';
    let currentWord = '';
    let questionQueue = []; // 題目佇列 (固定 20 個)
    let currentQuestionIndex = 0;
    let wrongCounts = {};
    let unlockedStages = loadSaveData();

    function loadSaveData() {
      const saved = localStorage.getItem('typingGameProgress');
      if (saved) return JSON.parse(saved);
      let initial = {};
      for(let i=1; i<=12; i++) initial[i] = 1;
      return initial;
    }

    function saveProgress() {
      localStorage.setItem('typingGameProgress', JSON.stringify(unlockedStages));
    }

    function resetSaveData() {
      if (confirm("確定要重置所有闖關進度嗎？")) {
        localStorage.removeItem('typingGameProgress');
        for(let i=1; i<=12; i++) unlockedStages[i] = 1;
        alert("已重置所有存檔進度！");
        location.reload();
      }
    }

    let timeLeft = 10;
    let timer = null;

    document.addEventListener("DOMContentLoaded", function() {
      renderCalendarGrid();
      const keyF = document.getElementById('key-F');
      const keyJ = document.getElementById('key-J');
      if (keyF) keyF.classList.add('fj-key');
      if (keyJ) keyJ.classList.add('fj-key');
    });

    function goToCalendarScreen() {
      document.getElementById('welcome-screen').classList.remove('active');
      document.getElementById('calendar-screen').classList.add('active');
      document.body.style.background = "linear-gradient(135deg, #f0f4f8, #d9e2ec)";
    }

    function renderCalendarGrid() {
      const calendarGrid = document.getElementById('calendar-grid');
      if (calendarGrid) {
        calendarGrid.innerHTML = "";
        for (let i = 1; i <= 12; i++) {
          const card = document.createElement('div');
          card.className = 'month-badge-card';
          card.innerHTML = `
            <span class="month-num">${i}月</span>
            <div class="month-icon">${FESTIVAL_DATA[i].icon}</div>
            <div class="month-title">${FESTIVAL_DATA[i].title}</div>
            <div class="month-desc">${FESTIVAL_DATA[i].desc}</div>
          `;
          card.onclick = () => openStageSelect(i);
          calendarGrid.appendChild(card);
        }
      }
    }

    function openStageSelect(month) {
      currentMonth = month;
      document.body.style.background = FESTIVAL_DATA[month].themeBg;

      document.getElementById('calendar-screen').classList.remove('active');
      document.getElementById('stage-select-screen').classList.add('active');
      
      document.getElementById('stage-header-icon').innerText = FESTIVAL_DATA[month].icon;
      document.getElementById('stage-menu-title').innerText = `${currentMonth}月：${FESTIVAL_DATA[month].title} - 選擇關卡`;
      document.getElementById('stage-menu-desc').innerText = FESTIVAL_DATA[month].desc;
      
      renderStageGrid();
    }

    function renderStageGrid() {
      const stageGrid = document.getElementById('stage-grid');
      stageGrid.innerHTML = "";
      let maxUnlocked = unlockedStages[currentMonth];

      const stageNames = ["中排基礎挑戰", "上排字母特訓", "下排字母特訓", "中排+上排混合複習", "節慶高手特訓", "完美制霸挑戰"];

      for (let s = 1; s <= 6; s++) {
        const isLocked = s > maxUnlocked;
        const card = document.createElement('div');
        card.className = `stage-card ${isLocked ? 'locked' : ''}`;
        card.innerHTML = `
          <h3>Stage ${s} ${isLocked ? '🔒' : '⭐'}</h3>
          <p>${stageNames[s-1]}</p>
        `;
        if (!isLocked) {
          card.onclick = () => startStage(s);
        } else {
          card.onclick = () => alert("請先完成前一關解鎖本關卡！");
        }
        stageGrid.appendChild(card);
      }
    }

    function backToCalendar() {
      document.getElementById('stage-select-screen').classList.remove('active');
      document.getElementById('calendar-screen').classList.add('active');
      document.body.style.background = "linear-gradient(135deg, #f0f4f8, #d9e2ec)";
    }

    function backToStageSelect() {
      clearInterval(timer);
      const modal = document.getElementById('result-modal');
      if (modal) modal.style.display = 'none';

      document.getElementById('game-screen').classList.remove('active');
      document.getElementById('stage-select-screen').classList.add('active');
      renderStageGrid();
    }

    function startStage(stageNum) {
      currentStage = stageNum;
      document.getElementById('stage-select-screen').classList.remove('active');
      document.getElementById('game-screen').classList.add('active');
      
      const modal = document.getElementById('result-modal');
      if (modal) modal.style.display = 'none';

      document.getElementById('festival-title').innerText = `${currentMonth}月：${FESTIVAL_DATA[currentMonth].title}`;
      document.getElementById('festival-icon').innerText = FESTIVAL_DATA[currentMonth].icon;
      document.getElementById('theme-desc').innerText = FESTIVAL_DATA[currentMonth].desc;
      
      showReadyOverlay();
    }

    function showReadyOverlay() {
      const overlay = document.getElementById('countdown-overlay');
      const readyContent = document.getElementById('ready-content');
      const numEl = document.getElementById('countdown-number');
      
      overlay.style.display = 'flex';
      readyContent.style.display = 'block';
      numEl.style.display = 'none';
    }

    function startCountdown() {
      const readyContent = document.getElementById('ready-content');
      const numEl = document.getElementById('countdown-number');
      
      readyContent.style.display = 'none';
      numEl.style.display = 'block';
      
      let count = 3;
      numEl.innerText = count;

      let cdTimer = setInterval(() => {
        count--;
        if (count > 0) {
          numEl.innerText = count;
        } else if (count === 0) {
          numEl.innerText = "GO!";
        } else {
          clearInterval(cdTimer);
          document.getElementById('countdown-overlay').style.display = 'none';
          initStageGame();
        }
      }, 1000);
    }

    // 🎯 生成 20 個不連續重複題目的演算法
    function generate20Questions(stage) {
      let pool = [];
      let activeKeys = [];

      if (stage === 1) { // 中排 9 字 -> 生成 20 字 (每個約2~3次)
        activeKeys = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'];
        while (pool.length < 20) {
          pool = pool.concat(activeKeys);
        }
        pool = pool.slice(0, 20);
      } else if (stage === 2) { // 上排 10 字 -> 每個剛好 2 次 = 20 字
        activeKeys = ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'];
        pool = activeKeys.concat(activeKeys);
      } else if (stage === 3) { // 下排 7 字 -> 生成 20 字 (每個約2~3次)
        activeKeys = ['Z', 'X', 'C', 'V', 'B', 'N', 'M'];
        while (pool.length < 20) {
          pool = pool.concat(activeKeys);
        }
        pool = pool.slice(0, 20);
      } else if (stage === 4) { // 中+上排 19 字 -> 18字各出現1次 + 1字出現2次 = 20 字
        activeKeys = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'];
        pool = [...activeKeys];
        // 隨機選一個字母重複 2 次
        let extraKey = activeKeys[Math.floor(Math.random() * activeKeys.length)];
        pool.push(extraKey);
      } else { // 隨機 20 字
        activeKeys = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P', 'Z', 'X', 'C', 'V', 'B', 'N', 'M'];
        while (pool.length < 20) {
          pool = pool.concat(activeKeys);
        }
        pool = pool.slice(0, 20);
      }

      // 進行洗牌，確保絕不連續重複
      let result = [];
      let temp = [...pool];
      while (temp.length > 0) {
        let validIndices = temp.map((val, idx) => (result.length === 0 || val !== result[result.length - 1]) ? idx : -1).filter(idx => idx !== -1);
        
        if (validIndices.length === 0) {
          // 若陷入死胡同，重新洗牌
          return generate20Questions(stage);
        }
        
        let chosenIdx = validIndices[Math.floor(Math.random() * validIndices.length)];
        result.push(temp[chosenIdx]);
        temp.splice(chosenIdx, 1);
      }

      return result;
    }

    function initStageGame() {
      document.getElementById('stage-badge').innerText = `Stage ${currentStage}`;
      
      if (currentStage === 1) {
        document.getElementById('theme-desc').innerText += " (【第一關】中排指法練習)";
      } else if (currentStage === 2) {
        document.getElementById('theme-desc').innerText += " (【第二關】上排字母特訓)";
      } else if (currentStage === 3) {
        document.getElementById('theme-desc').innerText += " (【第三關】下排字母特訓)";
      } else if (currentStage === 4) {
        document.getElementById('theme-desc').innerText += " (【第四關】中排+上排混合複習)";
      }

      questionQueue = generate20Questions(currentStage);
      currentQuestionIndex = 0;
      wrongCounts = {};
      
      document.querySelectorAll('.key').forEach(el => {
        el.classList.remove('home-highlight', 'top-highlight', 'bottom-highlight');
      });
      if (currentStage === 1) {
        document.querySelectorAll('.home-row .key').forEach(el => el.classList.add('home-highlight'));
      } else if (currentStage === 2) {
        document.querySelectorAll('.top-row .key').forEach(el => el.classList.add('top-highlight'));
      } else if (currentStage === 3) {
        document.querySelectorAll('.bottom-row .key').forEach(el => el.classList.add('bottom-highlight'));
      } else if (currentStage === 4) {
        document.querySelectorAll('.home-row .key').forEach(el => el.classList.add('home-highlight'));
        document.querySelectorAll('.top-row .key').forEach(el => el.classList.add('top-highlight'));
      }

      showQuestion();
      startTimer();
    }

    function showQuestion() {
      if (currentQuestionIndex >= 20) {
        clearInterval(timer);
        if (currentStage >= unlockedStages[currentMonth] && currentStage < 6) {
          unlockedStages[currentMonth] = currentStage + 1;
          saveProgress();
        }
        showStageCompleteModal();
        return;
      }

      currentKey = questionQueue[currentQuestionIndex];

      let dict = FESTIVAL_DATA[currentMonth].wordsStage1;
      if (['Q','W','E','R','T','Y','U','I','O','P'].includes(currentKey)) {
        dict = FESTIVAL_DATA[currentMonth].wordsStage2;
      } else if (['Z','X','C','V','B','N','M'].includes(currentKey)) {
        dict = FESTIVAL_DATA[currentMonth].wordsStage3;
      }

      currentWord = (dict && dict[currentKey]) ? dict[currentKey] : "Festival";

      document.getElementById('highlight-letter').innerText = `[${currentKey}]`;
      document.getElementById('remaining-word').innerText = currentWord.slice(1);

      document.querySelectorAll('.key').forEach(el => el.classList.remove('active-target'));
      const targetKeyEl = document.querySelector(`.key[data-key="${currentKey}"]`);
      if (targetKeyEl) targetKeyEl.classList.add('active-target');

      updateProgressUI();
      updateFingerHintUI();
    }

    window.addEventListener('keydown', (e) => {
      const gameScreen = document.getElementById('game-screen');
      const overlay = document.getElementById('countdown-overlay');
      if (!gameScreen || !gameScreen.classList.contains('active')) return;
      if (overlay.style.display === 'flex') return;
      if (timeLeft <= 0) return;

      const pressedKey = e.key.toUpperCase();
      
      if (pressedKey.length === 1 && pressedKey >= 'A' && pressedKey <= 'Z') {
        if (pressedKey === currentKey) {
          const targetKeyEl = document.querySelector(`.key[data-key="${currentKey}"]`);
          if (targetKeyEl) {
            targetKeyEl.style.transform = 'scale(1.2)';
            setTimeout(() => targetKeyEl.style.transform = 'scale(1)', 150);
          }

          currentQuestionIndex++;
          showQuestion();
          if (currentQuestionIndex < 20) {
            resetTimer();
          }
        } else {
          wrongCounts[currentKey] = (wrongCounts[currentKey] || 0) + 1;
        }
      }
    });

    function updateProgressUI() {
      document.getElementById('progress-info').innerText = `本關目標進度：已打對 ${currentQuestionIndex} / 20 次`;
    }

    function startTimer() {
      resetTimer();
    }

    function resetTimer() {
      clearInterval(timer);
      timeLeft = 10;
      updateTimerUI();

      timer = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        updateFingerHintUI();

        if (timeLeft <= 0) {
          // 時間到自動跳下一題
          currentQuestionIndex++;
          showQuestion();
          if (currentQuestionIndex < 20) {
            resetTimer();
          }
        }
      }, 1000);
    }

    function updateTimerUI() {
      document.getElementById('time-left').innerText = timeLeft;
    }

    function updateFingerHintUI() {
      const hintBox = document.getElementById('finger-hint');
      if (!hintBox) return;

      if (timeLeft <= 5) {
        let positionText = FINGER_POSITIONS[currentKey] || '鍵盤字鍵';
        hintBox.innerText = `💡 提示：字母 [ ${currentKey} ] 在 ${positionText}`;
        hintBox.classList.add('show');
      } else {
        hintBox.classList.remove('show');
      }
    }

    function showStageCompleteModal() {
      let modal = document.getElementById('result-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'result-modal';
        modal.className = 'modal';
        document.body.appendChild(modal);
      }

      let maxWrongKey = '-';
      let maxWrongVal = 0;
      let analysisHTML = '';

      Object.keys(wrongCounts).forEach(k => {
        let err = wrongCounts[k];
        if (err > maxWrongVal) {
          maxWrongVal = err;
          maxWrongKey = k;
        }
      });

      if (maxWrongVal === 0) {
        analysisHTML = `<p style="color: #16a34a; font-weight: bold; text-align: center;">🌟 太神啦！本關 20 題零失誤，完美通關！</p>`;
      } else {
        analysisHTML = `
          <p>⚠️ <strong>最常打錯的字母：</strong> <span style="color: #dc2626; font-size: 1.2rem; font-weight: bold;">[ ${maxWrongKey} ]</span> (共錯 ${maxWrongVal} 次)</p>
          <p style="margin-bottom: 5px; font-weight: bold;">各字母錯字統計分佈：</p>
          <div style="max-height: 120px; overflow-y: auto; background: #fff; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
        `;
        Object.keys(wrongCounts).forEach(k => {
          analysisHTML += `<div>字母 <strong>${k}</strong>：錯 ${wrongCounts[k]} 次</div>`;
        });
        analysisHTML += `</div>`;
      }

      modal.innerHTML = `
        <div class="modal-content">
          <h2>🎉 Stage ${currentStage} 通關成功！</h2>
          <p>已成功完成 20 字特訓，解鎖下一關並存檔！</p>
          
          <div class="analysis-box">
            <h4>📊 系統錯字分析報告</h4>
            ${analysisHTML}
          </div>

          <button onclick="backToStageSelect()">返回關卡選單</button>
        </div>
      `;
      modal.style.display = 'flex';
    }
  </script>
